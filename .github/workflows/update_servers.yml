name: Auto Update Servers Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-servers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Test Real TLS/Reality Servers
        run: |
          python3 - << 'EOF'
          import urllib.request
          import base64
          import socket
          import ssl
          import time
          import re
          from concurrent.futures import ThreadPoolExecutor

          sources = [
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub3.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/Splitted-By-Protocol/vless.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/Splitted-By-Protocol/trojan.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity",
          ]

          raw_configs = []
          for url in sources:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      content = resp.read().decode('utf-8', errors='ignore').strip()
                      if "://" not in content:
                          try:
                              pad = len(content) % 4
                              if pad:
                                  content += '=' * (4 - pad)
                              content = base64.b64decode(content).decode('utf-8', errors='ignore')
                          except Exception:
                              pass
                      for line in content.splitlines():
                          line = line.strip()
                          if line.startswith(("vless://", "trojan://")):
                              if "security=reality" in line or "security=tls" in line:
                                  raw_configs.append(line)
              except Exception:
                  continue

          # حذف آی‌پی‌های کلودفلر و فستلی که پینگ کاذب می‌دهند
          cdn_prefixes = ("104.16.", "104.17.", "104.18.", "104.19.", "104.20.", "104.21.", "172.64.", "172.67.", "199.232.", "151.101.")
          filtered_configs = []
          seen_hosts = set()

          for cfg in raw_configs:
              m = re.search(r'://[^@]+@([^:/?#]+):(\d+)', cfg)
              if not m:
                  continue
              host, port = m.group(1), int(m.group(2))
              if host.startswith(cdn_prefixes) or host in seen_hosts:
                  continue
              seen_hosts.add(host)
              filtered_configs.append((cfg, host, port))
              if len(filtered_configs) >= 200:
                  break

          # تست واقعی هندشیک TLS/TCP روی پورت سرور
          def test_server(item):
              cfg, host, port = item
              try:
                  start = time.time()
                  sock = socket.create_connection((host, port), timeout=2.0)
                  ctx = ssl.create_default_context()
                  ctx.check_hostname = False
                  ctx.verify_mode = ssl.CERT_NONE
                  with ctx.wrap_socket(sock, server_hostname=host):
                      ping = int((time.time() - start) * 1000)
                      if 20 < ping < 900:
                          base_cfg = cfg.split('#')[0].strip()
                          return (ping, base_cfg)
              except Exception:
                  return None
              return None

          working = []
          with ThreadPoolExecutor(max_workers=35) as executor:
              for res in executor.map(test_server, filtered_configs):
                  if res:
                      working.append(res)

          working.sort(key=lambda x: x[0])
          final_lines = []
          for idx, (ping, base_cfg) in enumerate(working[:30]):
              # نام‌گذاری بدون فاصله برای جلوگیری از خطای فلاتر
              final_lines.append(f"{base_cfg}#Server-{idx+1}-{ping}ms")

          if final_lines:
              with open("servers.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(final_lines) + "\n")
              print(f"Successfully saved {len(final_lines)} verified servers!")
          EOF

      - name: Commit and Push servers.txt
        run: |
          git config --global user.name "NeonVPN Bot"
          git config --global user.email "bot@neonvpn.app"
          git add servers.txt
          git diff --staged --quiet || git commit -m "Update 30 verified servers [skip ci]"
          git push
