name: Generate Google Play Upload Keystore

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias neon_key \
            -storepass NeonVpn@2026 \
            -keypass NeonVpn@2026 \
            -dname "CN=Neon VPN, OU=Mobile, O=NeonTech, L=Global, S=Global, C=US"

      - name: Upload Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: neon-upload-keystore-SAVE-THIS
          path: upload-keystore.jks
