name: Build Android App Bundle for Google Play

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Recreate Modern Android Gradle Structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.neonvpn --project-name neon_vpn .
          python3 - << 'EOF'
          # افزودن مجوز اینترنت و جلوگیری از خطای Cleartext در WebView تبلیغات
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application android:usesCleartextTraffic="true"'
              )
          with open(manifest_path, "w") as f:
              f.write(content)

          # تنظیم minSdk روی 21 برای سازگاری با هسته V2Ray و WebView
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g_content = f.read()
          g_content = g_content.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          g_content = g_content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          with open(gradle_path, "w") as f:
              f.write(g_content)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-play-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
