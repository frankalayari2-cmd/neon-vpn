name: Build Signed Google Play Bundle (AAB)

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Structure, Convert Icon & Configure Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          rm -rf android
          flutter create --platforms=android --org com.neonvpn --project-name neon_vpn .
          
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat << 'EOF' > android/key.properties
          storePassword=NeonVpn@2026
          keyPassword=NeonVpn@2026
          keyAlias=neon_key
          storeFile=upload-keystore.jks
          EOF

          sudo apt-get update && sudo apt-get install -y python3-pil

          python3 - << 'EOF'
          import os
          import shutil
          from PIL import Image

          # تبدیل مستقیم عکس لوگو به PNG واقعی در تمام سایزهای استاندارد اندروید
          if os.path.exists("assets/logo.png"):
              shutil.rmtree("android/app/src/main/res/mipmap-anydpi-v26", ignore_errors=True)
              img = Image.open("assets/logo.png").convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              for folder, size in sizes.items():
                  target_dir = f"android/app/src/main/res/{folder}"
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.LANCZOS)
                  resized.save(f"{target_dir}/ic_launcher.png", format="PNG")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application android:usesCleartextTraffic="true"'
              )
          with open(manifest_path, "w") as f:
              f.write(content)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g_content = f.read()

          g_content = g_content.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          g_content = g_content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")

          signing_setup = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android {
          """
          g_content = g_content.replace("android {", signing_setup, 1)

          release_signing_config = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
          """
          g_content = g_content.replace("buildTypes {\n        release {", release_signing_config, 1)
          g_content = g_content.replace("signingConfig = signingConfigs.debug", "signingConfig = signingConfigs.release")
          g_content = g_content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          with open(gradle_path, "w") as f:
              f.write(g_content)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-vpn-google-play-signed
          path: build/app/outputs/bundle/release/app-release.aab
