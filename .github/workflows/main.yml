name: Build Android APK (Direct Phone Install)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Structure & Convert Icon
        run: |
          rm -rf android
          flutter create --platforms=android --org com.neonvpn --project-name neon_vpn .

          sudo apt-get update && sudo apt-get install -y python3-pil

          python3 - << 'EOF'
          import os
          import shutil
          from PIL import Image

          if os.path.exists("assets/logo.png"):
              shutil.rmtree("android/app/src/main/res/mipmap-anydpi-v26", ignore_errors=True)
              img = Image.open("assets/logo.png").convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              for folder, size in sizes.items():
                  target_dir = f"android/app/src/main/res/{folder}"
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.LANCZOS)
                  resized.save(f"{target_dir}/ic_launcher.png", format="PNG")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application android:usesCleartextTraffic="true"'
              )
          with open(manifest_path, "w") as f:
              f.write(content)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g_content = f.read()
          g_content = g_content.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          g_content = g_content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          with open(gradle_path, "w") as f:
              f.write(g_content)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-vpn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
