
name: Build VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Prepare Android Project & V2Ray Native Libs
        run: |
          cp pubspec.yaml pubspec.bak
          cp lib/main.dart main.bak
          flutter create --org com.neonvpn.app --project-name neon_vpn .
          mv pubspec.bak pubspec.yaml
          mv main.bak lib/main.dart
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/<application/<application android:extractNativeLibs="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          - name: Apply Custom Neon Logo
        run: |
          if [ -f "assets/logo.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp assets/logo.png "$dir/ic_launcher.png"
            done
          fi
          flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonVPN-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
