name: Build Android APK (Direct Phone Install)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Structure & Generate Real PNG Icon
        run: |
          rm -rf android
          flutter create --platforms=android --org com.neonvpn --project-name neon_vpn .

          pip install pillow
          python3 - << 'EOF'
          import os
          from PIL import Image

          # تبدیل تصویر به فرمت استاندارد RGBA PNG برای جلوگیری از خطای AAPT2
          if os.path.exists("assets/logo.png"):
              img = Image.open("assets/logo.png").convert("RGBA")
              img = img.resize((512, 512), Image.Resampling.LANCZOS)
              img.save("assets/logo_clean.png", format="PNG")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application android:usesCleartextTraffic="true"'
              )
          with open(manifest_path, "w") as f:
              f.write(content)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g_content = f.read()
          g_content = g_content.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          g_content = g_content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          with open(gradle_path, "w") as f:
              f.write(g_content)
          EOF

      - name: Install Dependencies & Apply Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-vpn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
