name: neon_vpn
description: Fast Android VPN
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_v2ray: ^1.0.8
  http: ^1.2.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  webview_flutter: 4.5.0

dependency_overrides:
  webview_flutter_android: 3.15.0
  webview_flutter_wkwebview: 3.12.0
  webview_flutter_platform_interface: 2.10.0

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_clean.png"
  adaptive_icon_background: "#070A12"
  adaptive_icon_foreground: "assets/logo_clean.png"
